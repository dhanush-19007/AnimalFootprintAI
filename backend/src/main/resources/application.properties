
spring.application.name=AnimalFootprintAI
server.port=8081

# FastAPI Model 1
ml.model1.base-url=${MODEL1_BASE_URL:http://127.0.0.1:8000}

# FastAPI Model 2
ml.model2.base-url=${MODEL2_BASE_URL:http://127.0.0.1:8002}

# Image upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Forwarding request timeout, in milliseconds
ml.connect-timeout-ms=3000
ml.read-timeout-ms=30000